name: Daily public data refresh

on:
  schedule:
    - cron: "30 22 * * *"
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: daily-public-data-refresh
  cancel-in-progress: false

jobs:
  refresh-featured-products:
    runs-on: ubuntu-latest

    steps:
      - name: Check out main
        uses: actions/checkout@v5
        with:
          ref: main
          fetch-depth: 0

      - name: Set up Node.js
        uses: actions/setup-node@v5
        with:
          node-version: 24
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Generate daily featured products
        run: node scripts/generate-featured-products-v1.mjs

      - name: Validate daily featured products
        run: node scripts/validate-featured-products-v1.mjs

      - name: Build application
        run: npm run build

      - name: Commit refreshed featured data
        shell: bash
        run: |
          if git diff --quiet -- data/generated/public-products/featured.json; then
            echo "Featured products are unchanged; no commit is needed."
            exit 0
          fi

          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add data/generated/public-products/featured.json
          git commit -m "chore: refresh daily featured products"
          git push origin HEAD:main
